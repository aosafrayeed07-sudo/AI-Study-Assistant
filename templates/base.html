<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <div class="logo">🎓 Study Assistant</div>

    <div class="nav-links">
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('subjects') }}">Subjects</a>
        <a href="{{ url_for('timer') }}">Timer</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
        <a href="{{ url_for('notes') }}">PDF Notes</a>
        <a href="{{ url_for('progress') }}">Progress</a>
        <a href="{{ url_for('ai_tutor') }}">AI Tutor</a>
        <a href="{{ url_for('about') }}">About</a>
    </div>
</nav>

<main>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
